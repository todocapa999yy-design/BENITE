name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Generar
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar
        run: |
          xcodebuild -project BENITE.xcodeproj -scheme BENITE -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/BENITE.app out/Payload/
          cd out && zip -r BENITE.ipa Payload

      - name: Subir
        uses: actions/upload-artifact@v4
        with:
          name: BENITE-ipa
          path: out/BENITE.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: out/BENITE.ipa
